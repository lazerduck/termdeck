version: '3'

tasks:
  docker:list-all:
    desc: 'Docker: list all containers'
    cmds:
      - docker ps -a

  ssh:example:
    desc: 'SSH: example server'
    cmds:
      - ssh example.com

  git:branches:
    desc: 'Git: recently updated branches'
    cmds:
      - git branch --sort=-committerdate
