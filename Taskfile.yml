version: '3'

tasks:
  install:
    desc: Install Termdeck from this checkout
    cmds:
      - ./install.sh

  test:
    desc: Run the smoke test
    cmds:
      - ./tests/smoke.sh

  doctor:
    desc: Check termdeck's runtime dependencies and catalogs
    cmds:
      - ./bin/termdeck doctor

  list:
    desc: Show the merged command catalog
    cmds:
      - ./bin/termdeck list

  package:
    desc: Build a release archive (VERSION=0.1.0 by default)
    vars:
      VERSION: '{{default "0.1.0" .VERSION}}'
    cmds:
      - ./scripts/package.sh {{.VERSION}}
